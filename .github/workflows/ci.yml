# CI is the only merge gate. Never merge red.
name: verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed = only explainers touched by the PR · all = full sweep'
        type: choice
        options: [changed, all]
        default: all

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Work out which explainers changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ inputs.scope }}" != "all" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            slugs=$(git diff --name-only "$base" HEAD \
              | grep -E '^explainers/[^/]+/' \
              | cut -d/ -f2 | sort -u | tr '\n' ' ')
            # a change to the template, schema, tools or index builder re-verifies everything
            if git diff --name-only "$base" HEAD | grep -qE '^(template/|schema/|tools/|package(-lock)?\.json)'; then
              slugs="--all"
            fi
          else
            slugs="--all"
          fi
          [ -z "$slugs" ] && slugs=""
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "verifying: ${slugs:-<nothing changed>}"

      - name: Verify index.html and atlas.json are up to date
        run: |
          node tools/build_index.mjs
          if ! git diff --quiet -- index.html atlas.json; then
            echo "::error::index.html / atlas.json are stale — run 'node tools/build_index.mjs' and commit."
            git --no-pager diff --stat -- index.html atlas.json
            exit 1
          fi

      - name: Verify explainers
        if: steps.scope.outputs.slugs != ''
        run: node tools/verify.mjs ${{ steps.scope.outputs.slugs }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 14
